name: Regression tests

on:
  push:
    branches: [main, "test/**", "fix/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      audit_known_bugs:
        description: Treat documented known bugs as ordinary failures
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      AMVM_TEST_DEVICE: cpu
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      AUDIT_KNOWN_BUGS: ${{ inputs.audit_known_bugs || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
          python -m pip check
      - name: Run unit and integration tests
        run: |
          args=()
          if [ "$AUDIT_KNOWN_BUGS" = "true" ]; then
            args+=(--runxfail)
          fi
          python -m pytest "${args[@]}" --junitxml=test-results.xml
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: warn
