name: Regression tests

on:
  push:
    branches: [main, "test/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      AMVM_TEST_DEVICE: cpu
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
          # tests/test_minviol_parity.py importorskips on this. Without it the
          # test that holds minviol to the batched engine's exact trajectory
          # reports as skipped, which looks the same as passing.
          python -m pip install -e packages/minviol
          python -m pip check
      - name: Run unit and integration tests
        run: python -m pytest --junitxml=test-results.xml

      - name: Run the minviol package's own tests
        # `pytest` at this root honours pytest.ini's `testpaths = tests`, which
        # collects AMVM's suite and none of the package's. The package's suite had
        # therefore never run on Linux, and when it finally did it failed three
        # assertions that hold only on Apple Silicon. Run it explicitly.
        working-directory: packages/minviol
        run: python -m pytest -q --junitxml=minviol-results.xml
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: warn
